name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Spring Boot JAR
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "build/libs/*.jar"
          target: "/opt/ecommerce/"
          overwrite: true

      - name: Write production env file and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/ecommerce
            printf '%s' "${{ secrets.APP_ENV }}" | sudo tee /opt/ecommerce/.env > /dev/null
            ls -1t /opt/ecommerce/*.jar 2>/dev/null | head -n 1 | xargs -I{} sudo cp {} /opt/ecommerce/ecommerce.jar
            sudo systemctl daemon-reload
            sudo systemctl restart ecommerce
            sudo systemctl status ecommerce --no-pager
