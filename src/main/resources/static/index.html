<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShopLite</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232563eb'/><text x='8' y='12' font-size='10' fill='white' text-anchor='middle' font-family='sans-serif'>S</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#products">ShopLite</a>
      <nav class="nav">
        <a href="#products" data-tab="products" class="customer-tab">Products</a>
        <a href="#cart" data-tab="cart" class="customer-tab">Cart <span id="cart-badge" class="badge-count hidden">0</span></a>
        <a href="#orders" data-tab="orders" class="customer-tab">Orders</a>
        <a href="#admin" data-tab="admin" id="admin-tab" class="hidden">Product Management</a>
        <a href="#dashboard" data-tab="dashboard" id="dashboard-tab" class="hidden">Monitoring Dashboard</a>
      </nav>
      <div id="user-area" class="user-area"></div>
    </div>
  </header>

  <main id="app" class="container"></main>

  <div id="toasts" class="toasts"></div>

  <button id="floating-cart" class="floating-cart hidden" aria-label="View cart">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"></circle>
      <circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>
    <span id="floating-cart-count" class="floating-cart-badge hidden">0</span>
  </button>

  <div id="bot-widget" class="bot-widget hidden">
    <button id="bot-bubble" class="bot-bubble" aria-label="Open chat assistant">Need help?</button>
    <div id="bot-panel" class="bot-panel hidden">
      <div class="bot-header">
        <span class="bot-title">ShopLite Assistant</span>
        <button id="bot-close" class="bot-close" aria-label="Close chat">&times;</button>
      </div>
      <div id="bot-messages" class="bot-messages"></div>
      <form id="bot-form" class="bot-input-row" data-form="bot">
        <input id="bot-input" type="text" placeholder="Ask about your cart..." autocomplete="off" />
        <button type="submit" class="button primary">Send</button>
      </form>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
